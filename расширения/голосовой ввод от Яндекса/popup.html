<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: rgba(20,20,20,.92); overflow: hidden; }
  #text {
    box-sizing: border-box;
    width: 100%; height: 64px;
    padding: 8px 14px;
    color: #fff;
    font: 15px/1.35 "Times", sans-serif;
    white-space: pre-wrap;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #text::-webkit-scrollbar { display: none; }
  #state {
    position: fixed; top: 2px; right: 8px;
    color: #8be28b; font: 10px sans-serif; opacity: .8;
  }
</style>
</head>
<body>
  <div id="state">слушаю…</div>
  <div id="text"></div>
  <button id="toggle" style="width:100%;padding:6px 0;border:0;cursor:pointer;background:#3c4043;color:#fff;font:12px sans-serif">старт / стоп</button>
  <script src="popup.js"></script>
</body>
</html>
