plugins {
    id 'com.android.application'
}

android {
    namespace 'com.egor.webtube'
    compileSdk 34

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "com.egor.webtube"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
